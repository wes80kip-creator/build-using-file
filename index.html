<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/assets/gigwork-logo.svg" />
    <link rel="canonical" href="https://www.gigworksite.com/" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.gigworksite.com/" />
    <meta property="og:site_name" content="GIGWORK SITE" />
    <meta property="og:title" content="GIGWORK SITE – Freelance Services, Remote Jobs &amp; Digital Academy" />

    <meta property="og:image:alt" content="GIGWORK SITE Platform Logo" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:domain" content="www.gigworksite.com" />
    <meta name="twitter:url" content="https://www.gigworksite.com/" />
    <meta name="twitter:title" content="GIGWORK SITE – Freelance Services, Remote Jobs &amp; Digital Academy" />

    <meta name="twitter:image" content="https://www.gigworksite.com/assets/gigwork-logo.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.gigworksite.com/#website",
          "url": "https://www.gigworksite.com/",
          "name": "GIGWORK SITE",
          "description": "The premier freelance marketplace, remote jobs board, digital courses academy, and affiliate rewards platform.",
          "publisher": {
            "@id": "https://www.gigworksite.com/#organization"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.gigworksite.com/#organization",
          "name": "GIGWORK SITE",
          "url": "https://www.gigworksite.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.gigworksite.com/assets/gigwork-logo.svg"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "info@gigworksite.com",
            "contactType": "customer service"
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://www.gigworksite.com/#webapp",
          "name": "GIGWORK SITE Platform",
          "url": "https://www.gigworksite.com/",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "All",
          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "USD",
            "lowPrice": "0"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
