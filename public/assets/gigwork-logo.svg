<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="gwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="gwAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="gwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Hexagon / Rounded badge -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#gwGrad)" filter="url(#gwShadow)"/>
    <!-- Briefcase + Lightning dynamic icon -->
    <path d="M20 23 C20 20.8 21.8 19 24 19 L36 19 C38.2 19 40 20.8 40 23 L40 26 L20 26 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="15" y="25" width="30" height="22" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M15 32 L30 38 L45 32" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <!-- Vibrant energy bolt badge -->
    <circle cx="43" cy="18" r="9" fill="url(#gwAccent)"/>
    <path d="M43 13 L40 18 L43.5 18 L42 23 L46 17.5 L43 17.5 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- Typography -->
  <g transform="translate(82, 48)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" fill="#0F172A" letter-spacing="-0.5">
      Gig<tspan fill="url(#gwGrad)">Work</tspan>
    </text>
    <text y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="1.5">
      MARKETPLACE &amp; ACADEMY
    </text>
  </g>
